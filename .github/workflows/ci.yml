# 代码检查：类型检查 + 后端测试 + Web 测试。本机跑不动全套（跨国链路太慢），交给这里跑。
#
# 测试用 runner 自带的 PostgreSQL 容器，**不用 Neon**：测试框架会给每个测试文件复制一份“模板库”，
# 而复制要求模板库上没有别的连接——Neon 的计算节点内部进程会挂在每个库上，复制经常被拒
# （现象：source database "dailyhot_ci" is being accessed by other users）。引擎上游自己的 CI 也是这么做的。
#
# 这套流程不需要任何仓库密钥：测试里的模型服务商都指向本机 stub。
name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dailyhot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/dailyhot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 不需要数据库的测试
        run: npm run test:standalone
      - name: 构建网页
        run: npm run build -w @aihot/web
      - name: 装浏览器（Web 测试用）
        # 两个都要装：测试里既有 Chromium 用例也有 WebKit 用例（native-video 各跑一遍）。
        run: npx playwright install --with-deps chromium webkit
      - name: Web 测试
        run: |
          set +e
          node --test apps/web/tests/*.test.ts 2>&1 | tee /tmp/web-tests.log
          status=${PIPESTATUS[0]}
          # 把失败的用例名做成注解。注解是公开的（日志要登录才能看），出问题时不用登录也知道挂在哪。
          grep -a '^✖' /tmp/web-tests.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line#✖ }"
          done
          exit "$status"
      - name: 后端测试
        run: |
          set +e
          npm test 2>&1 | tee /tmp/backend-tests.log
          status=${PIPESTATUS[0]}
          grep -a '^✖' /tmp/backend-tests.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line#✖ }"
          done
          exit "$status"
