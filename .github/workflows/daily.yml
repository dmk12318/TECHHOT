# 每天的出刊：采集 → 处理/评分/写作 → 归组 → 出刊。
# 用的是引擎的“跑一次就跑完”入口 engine/scripts/run-once.ts（常驻 worker 的替代）。
#
# 要配的仓库 Secrets：
#   DATABASE_URL    Neon 的 direct 连接串（带 sslmode=require，不要 -pooler）
#   LLM_API_KEY     模型接口的 key
# 要配的仓库 Variables（可选，不配就用下面的默认值）：
#   LLM_BASE_URL / LLM_MODEL / SITE_URL
#
# 发布：静态站发到本仓库的 GitHub Pages（项目站地址是 <用户名>.github.io/<仓库名>/）。
# 地址里的 <仓库名> 那一段就是站点的「子路径」，构建时会按 SITE_URL 自动带上，改了仓库名要同步改 SITE_URL。
name: 出刊

on:
  schedule:
    # GitHub 的 cron 用 UTC。北京时间 08:10 = UTC 00:10：出当天那期日报。
    - cron: "10 0 * * *"
    # 北京时间 20:10 = UTC 12:10：下午补一次，让“全部动态”别停在早上。
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: 最长跑多少分钟
        default: "45"

# 两次运行不重叠：同一个库上并发跑会互相抢队列。
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
      LLM_EXTRA_JSON: '{"thinking":{"type":"disabled"}}'
      SITE_URL: ${{ vars.SITE_URL || 'https://dmk12318.github.io/TECHHOT' }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: 跑一次管线
        env:
          COLLECT_ENABLED: "true"
          MODEL_CALLS_ENABLED: "true"
        run: |
          set +e
          node scripts/run-once.ts --budget ${{ github.event.inputs.budget || '45' }} 2>&1 | tee /tmp/pipeline.log
          status=${PIPESTATUS[0]}
          # 把失败原因做成注解。注解是公开的（日志要登录才能看），出问题时不用登录也知道挂在哪。
          grep -a 'report failed\|reports failed' /tmp/pipeline.log | tail -8 | while IFS= read -r line; do
            echo "::error::${line:0:600}"
          done
          exit "$status"
      - name: 取回分享图缓存
        # 分享图每张都要渲染一次，一天一百多张；缓存起来只补新出现的，否则条目越攒越多，导出会慢到跑不完。
        uses: actions/cache@v4
        with:
          path: engine/.data/og
          key: og-${{ github.run_number }}
          restore-keys: og-
      - name: 导出静态站
        # 导出要 api 活着（预渲染在线取数）：起一个临时的，这个 workflow 结束就没了。
        run: |
          node apps/api/src/main.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3001/api/health 2>/dev/null && break; sleep 1; done
          set +e
          node scripts/export-static.ts --out static 2>&1 | tee /tmp/export.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # 注解是公开的（日志要登录才能看）：导出挂在哪一步、报什么错，不用登录也知道。
            tail -6 /tmp/export.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit "$status"
      - name: 装浏览器（静态站体检用）
        run: npx playwright install --with-deps chromium
      - name: 静态站体检
        # 链接取不到、客户端跳转坏掉、搜索不出结果，都在这里挡住：宁可这一期不发，也别发一个点进去 404 的站。
        run: |
          set +e
          node --test apps/web/tests/static-nav.test.ts 2>&1 | tee /tmp/static-tests.log
          status=${PIPESTATUS[0]}
          grep -a '^✖' /tmp/static-tests.log | sort -u | head -5 | while IFS= read -r line; do
            echo "::error::${line#✖ }"
          done
          exit "$status"
      - name: 留下静态站产物
        # 出问题时方便直接下载来看（发布用的是下一段）。
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: engine/static
          retention-days: 7
      - name: 准备 GitHub Pages
        # enablement: 仓库里没开过 Pages 时，顺手把它开成「用 Actions 发布」。
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包给 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/static
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
